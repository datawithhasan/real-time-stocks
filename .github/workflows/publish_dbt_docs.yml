name: Publish dbt docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.11.0

      # ✅ FAIL FAST: show which secrets are missing (doesn't print values)
      - name: Validate required env vars (no secrets printed)
        shell: bash
        run: |
          missing=0
          for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PASSWORD SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is missing or empty. Check GitHub Secrets name exactly."
              missing=1
            else
              echo "$v is set ✅"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Create profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cp ci/profiles.yml ~/.dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt_stocks/dbt_stocks
        run: dbt deps

      - name: dbt debug
        working-directory: dbt_stocks/dbt_stocks
        run: dbt debug

      - name: dbt docs generate
        working-directory: dbt_stocks/dbt_stocks
        run: dbt docs generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_stocks/dbt_stocks/target

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
