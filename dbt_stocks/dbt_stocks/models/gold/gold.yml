version: 2

models:
  - name: fct_daily_ohlc
    description: "Daily OHLC fact table per symbol (Power BI-ready)."
    columns:
      - name: symbol
        description: "Ticker symbol."
        tests: [not_null]
      - name: trading_day
        description: "Trading day (day grain)."
        tests: [not_null]
      - name: open_price
        tests: [not_null]
      - name: high_price
        tests: [not_null]
      - name: low_price
        tests: [not_null]
      - name: close_price
        tests: [not_null]

  - name: fct_latest_quotes
    description: "Latest available quote per symbol (Power BI KPIs/cards)."
    columns:
      - name: symbol
        description: "Ticker symbol."
        tests: [not_null, unique]
      - name: market_ts
        tests: [not_null]
      - name: close_price
        tests: [not_null]